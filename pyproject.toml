[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "easypics-sdk"
version = "0.0.1"
description = "Official Python SDK for the EasyPics Developer API."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Septy Studios" }
]
keywords = ["easypics", "sdk", "api", "media", "image-hosting", "python"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "typing-extensions>=4.12"
]

[project.urls]
Homepage = "https://easypics.lol/developers"
Documentation = "https://easypics.lol/developers"
Repository = "https://github.com/Septy-Studios/easypics-python"
Issues = "https://github.com/Septy-Studios/easypics-python/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/easypics"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
